alias: SOLID Veille HC - activation 22h
description: ""
triggers:
  - at: "22:00:00"
    trigger: time
conditions:
  - condition: state
    entity_id: input_boolean.solid_veille_hc
    state: "on"
actions:
  - data:
      topic: solid/command/battery_discharge_inhibit
      retain: false
      payload: |
        {
          "source": "homeassistant",
          "mode": "offpeak",
          "enabled": true,
          "active_now": true,
          "duration_h": 8,
          "action": "apply_inhibit_plan",
          "reason": "offpeak_window_start"
        }
    action: mqtt.publish
mode: single
