alias: SOLID Veille HC - arrêt 06h
description: ""
triggers:
  - at: "06:00:00"
    trigger: time
conditions:
  - condition: state
    entity_id: input_boolean.solid_veille_hc
    state: "on"
actions:
  - data:
      topic: solid/command/battery_discharge_inhibit
      retain: false
      payload: |
        {
          "source": "homeassistant",
          "mode": "offpeak",
          "enabled": false,
          "active_now": false,
          "action": "restore_inhibit_plan",
          "reason": "offpeak_window_end"
        }
    action: mqtt.publish
mode: single
